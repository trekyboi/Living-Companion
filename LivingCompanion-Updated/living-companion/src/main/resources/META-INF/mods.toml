modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

# --- Hard dependencies -----------------------------------------------------

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Better Combat 1.8.6 and 1.9.x are supported version families.
# For Better Combat 1.9.0, install Better Mob Combat Fix (BMCFIX) 1.0.2
# alongside Better Mob Combat 1.3.0 to patch the upstream API breakages.
[[dependencies.${mod_id}]]
    modId="bettercombat"
    mandatory=false
    versionRange="[1.8.6,2)"
    ordering="AFTER"
    side="BOTH"

# Player Animator provides the animation runtime used by Better Combat.
[[dependencies.${mod_id}]]
    modId="playeranimator"
    mandatory=false
    versionRange="[1.0.0,)"
    ordering="AFTER"
    side="BOTH"

# Mob Player Animator applies Player Animator animations to humanoid mobs.
[[dependencies.${mod_id}]]
    modId="mobplayeranimator"
    mandatory=false
    versionRange="[1.3.0,)"
    ordering="AFTER"
    side="CLIENT"

# Better Mob Combat adds weapon-aware melee AI and Player Animator attack poses
# for humanoid mobs such as this companion. It remains optional.
[[dependencies.${mod_id}]]
    modId="bettermobcombat"
    mandatory=false
    versionRange="[1.3.0,2)"
    ordering="AFTER"
    side="BOTH"
