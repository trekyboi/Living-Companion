modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

# --- Hard dependencies -----------------------------------------------------

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Better Combat is optional. Vanilla melee combat remains available without it.
[[dependencies.${mod_id}]]
    modId="bettercombat"
    mandatory=false
    versionRange="[1.9.0,)"
    ordering="AFTER"
    side="BOTH"

# --- Optional dependencies --------------------------------------------------
# Better Combat ("bettercombat") is declared as an OPTIONAL dependency in
# Phase 6. The mod must remain fully functional without it.
