# ---------------------------------------------------------------------------
# Gradle / JVM
# ForgeGradle's Minecraft decompile/recompile pipeline needs a large heap.
# 3G is the MDK default; do not lower it on a normal dev machine.
# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# ---------------------------------------------------------------------------
# Minecraft / Forge (verified against https://maven.minecraftforge.net)
# ---------------------------------------------------------------------------
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.0
forge_version_range=[47,)
loader_version_range=[47,)

# ---------------------------------------------------------------------------
# Mappings — official Mojang mappings, the 1.20.1 standard.
# ---------------------------------------------------------------------------
mapping_channel=official
mapping_version=1.20.1

# ---------------------------------------------------------------------------
# Mod metadata (expanded into META-INF/mods.toml by processResources)
# ---------------------------------------------------------------------------
mod_id=livingcompanion
mod_name=Living Companion
mod_license=MIT
mod_version=1.0.0
mod_group_id=com.livingcompanion
mod_authors=Living Companion Team
mod_description=A knight companion who follows you, fights beside you, chats about events, and remembers important adventures.
